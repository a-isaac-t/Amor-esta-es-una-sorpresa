<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1, #fccb90);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
    text-align: center;
    color: white;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    padding: 40px 20px;
}

h1 {
    font-size: 2.5rem;
    animation: fadeIn 2s ease forwards;
}

p {
    font-size: 1.2rem;
    opacity: 0;
    animation: fadeIn 3s ease forwards;
    animation-delay: 1s;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

button {
    margin-top: 30px;
    padding: 15px 25px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4e50;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.carta {
    display: none;
    margin-top: 30px;
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}

.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Para la persona más hermosa 💕</h1>
    <p>Desde que llegaste a mi vida, todo es más bonito.</p>

    <button onclick="mostrarCarta()">Toca aquí 💌</button>

    <div class="carta" id="carta">
        <p>
        Gracias por cada sonrisa, por cada abrazo,  
        por cada momento que compartimos.  
        Eres mi lugar favorito en el mundo ❤️  
        </p>
    </div>
</div>

<script>
function mostrarCarta() {
    document.getElementById("carta").style.display = "block";
}

function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(crearCorazon, 500);
</script>

</body>
</html>
